<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>recscape</title>
<link rel="icon" href="recscape-icon.svg" type="image/svg+xml">
<style>
/* 兩站同一份框架(site-src/index.html), 只換 :root 那幾顆 -- 正本在 site-src/brands.json, 不要改產出的 sites/<brand>/index.html.
   recscape: 主題紫 #b300ff on 白. 文字用逆算強讀階 #8d00c9(白底 7.06).
   底色框只走 --k 的 alpha. 字色兩顆(--fg / --ink), 選中走系統紅. 字號兩個: 13 / 11. */
:root { --bg: #fff; --fg: #111; --k: 179, 0, 255; --ink: #8d00c9; --bar: rgba(255, 255, 255, .5); --tip: rgba(179, 0, 255, .12); }
* { box-sizing: border-box; }
button, input, select, textarea { border: 0; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.3 -apple-system, system-ui, sans-serif; }
body { padding: 4px; }
#bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 4px; padding: 4px; margin: -4px -4px 4px;
  background: var(--bar); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
#bar img { width: 18px; height: 18px; display: block; }
#now { min-width: 0; max-width: 34%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
#prog, #vol { position: relative; height: 4px; background: rgba(var(--k), .14); cursor: pointer; }
#prog { flex: 1; }
#vol { width: 64px; }
#prog i, #vol i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(var(--k), .6); }
#prog:hover i, #vol:hover i { background: rgba(var(--k), .9); }
#time, #tleft, .du { font-size: 11px; opacity: .6; font-variant-numeric: tabular-nums; white-space: nowrap; }
#list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 4px; }
.card { position: relative; background: rgba(var(--k), .07); cursor: pointer; user-select: none; }
.card:hover { background: rgba(var(--k), .14); }
.card:active, .card.on { background: rgba(var(--k), .24); }
.card img, .nocov { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
.nocov { background: rgba(var(--k), .1); }
.meta { display: flex; align-items: baseline; gap: 4px; padding: 3px; }
.fl { font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
.nm { flex: 1; }
.card.on .nm { color: #ff0000; }
.info, #bar button { background: none; padding: 0; margin: 0; cursor: pointer; line-height: 1; opacity: .8; }
.info:hover, #bar button:hover, .info:focus-visible, #bar button:focus-visible { opacity: 1; outline: none; }
.info { position: absolute; top: 3px; right: 3px; }
#tip { position: fixed; z-index: 9; max-width: 340px; padding: 3px; background: var(--tip); font-size: 11px; pointer-events: none;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
#tip b { display: block; color: var(--ink); }
</style>
</head>
<body data-brand="recscape" data-root="./">
<div id="bar">
  <img src="recscape-icon.svg" alt="recscape" title="recscape">
  <button id="play" aria-label="play / pause">▶️</button>
  <span id="now"></span>
  <div id="prog"><i></i></div>
  <span id="time"></span>
  <button id="loop"></button>
  <button id="timer"></button><span id="tleft"></span>
  <span aria-hidden="true">🔈</span><div id="vol" title="volume"><i></i></div>
</div>
<div id="list"></div>
<div id="tip" hidden></div>
<script src="data.js"></script>
<script src="player.js"></script>
</body>
</html>
