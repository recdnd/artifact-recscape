<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>recscape</title>
<link rel="icon" href="recscape-icon.svg" type="image/svg+xml">
<style>
/* 兩站同一份框架(site-src/index.html), 只換 :root 那幾顆 -- 正本在 site-src/brands.json, 不要改產出的 sites/<brand>/index.html.
   站只做目錄, 每張卡連去那支 YouTube(主筆 2026-10-03: 網站導鏈接去 youtube, 不當播放器). 站上不放音檔.
   recscape: 主題紫 #b300ff on 白. 文字用逆算強讀階 #8d00c9(白底 7.06).
   底色框只走 --k 的 alpha. 字色兩顆(--fg / --ink). 字號兩個: 13 / 11. */
:root { --bg: #fff; --fg: #111; --k: 179, 0, 255; --ink: #8d00c9; --bar: rgba(255, 255, 255, .5); }
* { box-sizing: border-box; }
button, input, select, textarea { border: 0; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.3 -apple-system, system-ui, sans-serif; }
body { padding: 4px; }
#bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 4px; padding: 4px; margin: -4px -4px 4px;
  background: var(--bar); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
#bar img { width: 18px; height: 18px; display: block; }
#bar a { margin-left: auto; line-height: 1; text-decoration: none; opacity: .8; }
#bar a:hover { opacity: 1; }
#list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 4px; }
.card { display: block; background: rgba(var(--k), .07); color: inherit; text-decoration: none; }
.card:hover { background: rgba(var(--k), .14); }
.card:active { background: rgba(var(--k), .24); }
.card img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
.meta { display: flex; align-items: baseline; gap: 4px; padding: 3px; }
.fl { font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
.nm { flex: 1; }
.du { font-size: 11px; opacity: .6; font-variant-numeric: tabular-nums; white-space: nowrap; }
</style>
</head>
<body>
<div id="bar">
  <img src="recscape-icon.svg" alt="recscape" title="recscape">
  <a href="https://www.youtube.com/channel/UCk7VOGA7cTXNsKZYbkXdYsA" target="_blank" rel="noopener" title="YouTube" aria-label="YouTube">▶️</a>
</div>
<div id="list"></div>
<script src="data.js"></script>
<script>
  // 只列已經公開的(排程時間到了才出現), 新的在前
  (() => {
    const L = (navigator.language || 'en').slice(0, 2), lang = L === 'ja' ? 'ja' : L === 'zh' ? 'zh' : 'en';
    const ST = { night: { en: 'Night', ja: '夜', zh: '夜' }, rain: { en: 'Rain', ja: '雨', zh: '雨' },
      wind: { en: 'Wind', ja: '風', zh: '風' }, empty: { en: 'Empty', ja: '無人', zh: '空' }, torch: { en: 'Torchlit', ja: '松明', zh: '火把' } };
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const now = Date.now();
    const list = document.getElementById('list');
    (window.TRACKS || []).filter(t => !t.at || Date.parse(t.at) <= now)
      .sort((a, b) => (b.at || '').localeCompare(a.at || ''))
      .forEach(t => {
        const nm = (t.names[lang] || t.names.en || t.id) + (t.state.length ? ' ' + t.state.map(x => (ST[x] || {})[lang] || x).join(lang === 'en' ? ' ' : '') : '');
        const a = document.createElement('a');
        a.className = 'card'; a.href = 'https://youtu.be/' + t.yt; a.target = '_blank'; a.rel = 'noopener';
        a.innerHTML = `<img src="https://i.ytimg.com/vi/${t.yt}/hqdefault.jpg" alt="" loading="lazy">` +
          `<div class="meta">${t.floor ? `<span class="fl">${t.floor}</span>` : ''}<span class="nm">${esc(nm)}</span>` +
          `<span class="du">${t.hours}h</span></div>`;
        list.appendChild(a);
      });
  })();
</script>
</body>
</html>
